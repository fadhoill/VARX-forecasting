[project]
name = "forecast-saham"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fadhoill", email = "fadhoilahmdd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arch>=9.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[project.scripts]
forecast-saham = "forecast_saham:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
